[package]
name = "cdk-lnbits"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
rust-version.workspace = true # MSRV
description = "CDK Lightning backend for a hosted LNbits wallet"
readme = "README.md"

[dependencies]
async-trait.workspace = true
bitcoin.workspace = true
cdk-common = { workspace = true, default-features = false, features = ["mint"] }
futures.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "connect"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util", "net", "io-util", "sync", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
